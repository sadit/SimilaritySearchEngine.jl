project:
  type: website
  output-dir: docs

execute:
  enabled: false

website:
  title: "SimilaritySearchEngine.jl"
  navbar:
    left:
      - href: index.qmd
        text: "Home"
      - href: architecture.qmd
        text: "Architecture"
      - href: tutorials/index.qmd
        text: "Tutorial"
    # The API reference is a separate Documenter site deployed beside this one, at the root of
    # the same Pages domain. An absolute URL rather than a relative one: this navbar is shared
    # by pages at two different depths, and `quarto preview` serves them off a local port where
    # no relative path could reach the deployed reference anyway.
    right:
      - href: https://sadit.github.io/SimilaritySearchEngine.jl/dev/
        text: "API reference"

format:
  html:
    theme:
      - cosmo
    css: styles.css
    toc: true
    mermaid:
      theme: neutral
