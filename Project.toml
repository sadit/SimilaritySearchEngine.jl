# Assembling a text index around a storage-backed adjacency list uses the positional
# constructors of BM25InvertedFile, TextInvertedFile and InvertedFile (no keyword injects `adj`),
# so this package depends on those structs' field order and on the internal types their documents
# are stored as -- internals that can change without a breaking release, as the BM25 field order
# already did once. The guard is `test/runtests.jl`, which builds, persists, reassembles and
# queries both text backends: a field-order change fails it rather than corrupting an index.
SimilaritySearch = "1.4.2"
SparseArrays = "1"
TextSearch = "1.1"
# 1.12, which is what CI verifies and what development happens on. This said 1.10 while
# nothing tested 1.10 -- a promise nobody checked, which is the shape of problem the packaging
# pass went looking for. The subpackage under server/ needs 1.12 outright (`[apps]`).
julia = "1.12"

[extras]
SparseArrays = "2f01184e-e22b-5df5-ae63-d93ebab69eaf"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Test", "SparseArrays"]
