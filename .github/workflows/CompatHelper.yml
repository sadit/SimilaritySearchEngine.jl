name: CompatHelper
on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:
# CompatHelper opens a pull request for each [compat] entry that a new release makes too narrow.
permissions:
  contents: write
  pull-requests: write
jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      # The runner has no Julia installed. Without this step every run failed with
      # "julia: command not found".
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - name: Pkg.add("CompatHelper")
        run: julia -e 'using Pkg; Pkg.add("CompatHelper")'
      # The three packages of this repository: the engine, the server and the Julia client.
      - name: CompatHelper.main()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPATHELPER_PRIV: ${{ secrets.DOCUMENTER_KEY }}
        run: julia -e 'using CompatHelper; CompatHelper.main(; subdirs=["", "server", "server/julia"])'
