name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      level:
        description: 'Test level (light or full)'
        required: false
        default: full

# The package images that julia-actions/cache keeps are compiled for this target. By default they
# are compiled for the CPU of the runner, and Julia rejects an image compiled for another CPU. The
# runners do not all have the same CPU. In 5 of the 10 runs of the engine job on 2026-11-24 and
# 2026-11-25, all its dependencies were compiled again, which added 4 to 5.5 minutes. In the run of
# eef7b1d, the Manifest was the same as in the run whose cache it restored. The variable does not
# change the code that the JIT compiles while the tests run.
#
# All the images of a cache must have the same target. An image for `generic` whose dependencies
# have native images compiles the code that it uses from those dependencies again. On 2026-11-26,
# SimilaritySearchClient took 540 s that way, against 2.0 s with native images and 1.95 s with
# generic images everywhere. In the run of 4bb2a26, the first after this variable, the engine
# took 235 s against 90 to 117 s before, and the server 128 s against 4 to 5 s. For this reason
# the two cache steps use the prefix `julia-cache-generic`, which no cache with native images has.
env:
  JULIA_CPU_TARGET: generic

jobs:
  # Every change, both packages, light level: the engine's suite without its whole-dataset
  # algorithms and corpus fits, and the server's boundary tests without the HTTP/CLI
  # end-to-end suites. That boundary is what an engine-side rename breaks, so this catches
  # the class of drift that used to be found weeks later, when the two lived in separate
  # repositories.
  test:
    name: ${{ matrix.package }} - Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          # 1.12 only: it is what development happens on, and what the server's `[apps]`
          # entries require (Pkg.Apps does not exist before it).
          - '1.12'
        os:
          - ubuntu-latest
        package:
          - engine
          - server
          - client
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-cache-generic;workflow=${{ github.workflow }};job=${{ github.job }}
      # Pkg.test installs the dependencies and runs their build scripts. Pkg.test loads only the
      # images compiled with --check-bounds=yes, so no step precompiles the images without it:
      # for the engine alone, that was 59 to 94 s each time its code changed.
      - name: Test the engine
        if: matrix.package == 'engine'
        run: julia --project=. -e 'using Pkg; Pkg.test()'
        env:
          # The suite exercises real concurrency (readers against a writer), so a
          # single-threaded runner would silently skip what those tests are for.
          JULIA_NUM_THREADS: auto
      # The Julia client's own tests need no server. Its tests against a server run in the
      # server's full suite below.
      - name: Test the Julia client
        if: matrix.package == 'client'
        run: julia --project=server/julia -e 'using Pkg; Pkg.test()'
      # The light level starts no subprocess, so the precompile workload of the server
      # (server/src/precompile_workload.jl) does not make it faster. Without the workload, the
      # precompilation of the server took 6 s instead of 66 s in a test run (2026-11-25).
      #
      # JULIA_PKG_PRECOMPILE_AUTO=0 stops Pkg.develop from precompiling the images without
      # --check-bounds, which Pkg.test does not load. When the engine changed, that took 69 to
      # 71 s. Pkg.test runs in its own process, without the variable, so it still precompiles
      # the images it loads.
      - name: Test the server against this repository's engine
        if: matrix.package == 'server'
        run: |
          printf '[SimilaritySearchServer]\nprecompile_workload = false\n' > server/LocalPreferences.toml
          JULIA_PKG_PRECOMPILE_AUTO=0 julia --project=server -e 'using Pkg; Pkg.develop(path=".")'
          julia --project=server -e 'using Pkg; Pkg.test()'
        env:
          JULIA_NUM_THREADS: auto

  # The Node.js client (server/node/, PLAN.md §5.17), without a server: its tests answer each
  # request with a function given to the client. Its tests against a server run in the server's
  # full suite. Node.js 22 is the oldest version the package supports, and 24 is the active LTS.
  node-client:
    name: Node.js client - Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - '22'
          - '24'
    defaults:
      run:
        working-directory: server/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # No lock file is committed (PLAN.md §5.17): package.json fixes the exact versions.
      - run: npm install --no-audit --no-fund
      - run: npm test

  # The full level: everything above plus the engine's whole-dataset algorithms and the
  # server's HTTP/job/CLI end-to-end suites, which start real servers and spawn Julia
  # subprocesses. Minutes rather than seconds, so it runs before a release (a tag) or on
  # request -- never on every push.
  full:
    name: Full suite (pre-release)
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-cache-generic;workflow=${{ github.workflow }};job=${{ github.job }}
      # api/21 of the server's full level tests the Node.js client against the test server. It
      # uses the `node` in PATH, installs the client and builds it.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Engine, full level
        run: julia --project=. -e 'using Pkg; Pkg.test(test_args=["full"])'
        env:
          JULIA_NUM_THREADS: auto
      # As in the light job: Pkg.test and the job subprocesses of the server, which inherit
      # --check-bounds=yes, load only the images compiled with it.
      - name: Server, full level
        run: |
          JULIA_PKG_PRECOMPILE_AUTO=0 julia --project=server -e 'using Pkg; Pkg.develop(path=".")'
          julia --project=server -e 'using Pkg; Pkg.test(test_args=["full"])'
        env:
          JULIA_NUM_THREADS: auto
