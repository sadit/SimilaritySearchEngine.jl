name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      level:
        description: 'Test level (light or full)'
        required: false
        default: full

jobs:
  # Every change, both packages, light level: the engine's suite without its whole-dataset
  # algorithms and corpus fits, and the server's boundary tests without the HTTP/CLI
  # end-to-end suites. That boundary is what an engine-side rename breaks, so this catches
  # the class of drift that used to be found weeks later, when the two lived in separate
  # repositories.
  test:
    name: ${{ matrix.package }} - Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          # The two ends of the range Project.toml's `julia = "1.10"` promises.
          - '1.10'
          - '1.12'
        os:
          - ubuntu-latest
        package:
          - engine
          - server
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - name: Test the engine
        if: matrix.package == 'engine'
        run: julia --project=. -e 'using Pkg; Pkg.build(); Pkg.test()'
        env:
          # The suite exercises real concurrency (readers against a writer), so a
          # single-threaded runner would silently skip what those tests are for.
          JULIA_NUM_THREADS: auto
      - name: Test the server against this repository's engine
        if: matrix.package == 'server'
        run: |
          julia --project=server -e 'using Pkg; Pkg.develop(path="."); Pkg.build(); Pkg.test()'
        env:
          JULIA_NUM_THREADS: auto

  # The full level: everything above plus the engine's whole-dataset algorithms and the
  # server's HTTP/job/CLI end-to-end suites, which start real servers and spawn Julia
  # subprocesses. Minutes rather than seconds, so it runs before a release (a tag) or on
  # request -- never on every push.
  full:
    name: Full suite (pre-release)
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Engine, full level
        run: julia --project=. -e 'using Pkg; Pkg.test(test_args=["full"])'
        env:
          JULIA_NUM_THREADS: auto
      - name: Server, full level
        run: |
          julia --project=server -e 'using Pkg; Pkg.develop(path="."); Pkg.test(test_args=["full"])'
        env:
          JULIA_NUM_THREADS: auto
