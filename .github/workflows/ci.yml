name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      level:
        description: 'Test level (light or full)'
        required: false
        default: full

jobs:
  # Every change, both packages, light level: the engine's suite without its whole-dataset
  # algorithms and corpus fits, and the server's boundary tests without the HTTP/CLI
  # end-to-end suites. That boundary is what an engine-side rename breaks, so this catches
  # the class of drift that used to be found weeks later, when the two lived in separate
  # repositories.
  test:
    name: ${{ matrix.package }} - Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          # 1.12 only: it is what development happens on, and what the server's `[apps]`
          # entries require (Pkg.Apps does not exist before it).
          - '1.12'
        os:
          - ubuntu-latest
        package:
          - engine
          - server
          - client
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Test the engine
        if: matrix.package == 'engine'
        run: julia --project=. -e 'using Pkg; Pkg.build(); Pkg.test()'
        env:
          # The suite exercises real concurrency (readers against a writer), so a
          # single-threaded runner would silently skip what those tests are for.
          JULIA_NUM_THREADS: auto
      # The Julia client's own tests need no server. Its tests against a server run in the
      # server's full suite below.
      - name: Test the Julia client
        if: matrix.package == 'client'
        run: julia --project=server/julia -e 'using Pkg; Pkg.test()'
      - name: Test the server against this repository's engine
        if: matrix.package == 'server'
        run: |
          julia --project=server -e 'using Pkg; Pkg.develop(path="."); Pkg.build(); Pkg.test()'
        env:
          JULIA_NUM_THREADS: auto

  # The Node.js client (server/node/, PLAN.md §5.17), without a server: its tests answer each
  # request with a function given to the client. Its tests against a server run in the server's
  # full suite. Node.js 22 is the oldest version the package supports, and 24 is the active LTS.
  node-client:
    name: Node.js client - Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - '22'
          - '24'
    defaults:
      run:
        working-directory: server/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # No lock file is committed (PLAN.md §5.17): package.json fixes the exact versions.
      - run: npm install --no-audit --no-fund
      - run: npm test

  # The full level: everything above plus the engine's whole-dataset algorithms and the
  # server's HTTP/job/CLI end-to-end suites, which start real servers and spawn Julia
  # subprocesses. Minutes rather than seconds, so it runs before a release (a tag) or on
  # request -- never on every push.
  full:
    name: Full suite (pre-release)
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      # api/21 of the server's full level tests the Node.js client against the test server. It
      # uses the `node` in PATH, installs the client and builds it.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Engine, full level
        run: julia --project=. -e 'using Pkg; Pkg.test(test_args=["full"])'
        env:
          JULIA_NUM_THREADS: auto
      - name: Server, full level
        run: |
          julia --project=server -e 'using Pkg; Pkg.develop(path="."); Pkg.test(test_args=["full"])'
        env:
          JULIA_NUM_THREADS: auto
